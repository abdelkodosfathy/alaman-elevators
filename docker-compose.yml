# Production-like local stack. For quick dev without Docker use `npm run db:start`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alaman
      POSTGRES_PASSWORD: alaman
      POSTGRES_DB: alaman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
